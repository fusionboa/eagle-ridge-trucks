<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the full dangm.ca inventory: new & used cars and trucks for sale. Search by make, model, price.">
  <meta name="keywords" content="cars for sale, trucks for sale, used cars, used trucks, dangm.ca, vehicle inventory">
  <title>Inventory | dangm.ca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-inventory">
  <!-- Navigation -->
  <nav class="nav scrolled" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-mark">DG</span>
        <span class="logo-text">dangm<em>.ca</em></span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="inventory.html" class="active">Inventory</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <a href="#inventory" class="nav-cta">View Inventory</a>
    </div>
  </nav>

  <!-- Page hero -->
  <header class="page-hero" id="top">
    <div class="page-hero-bg"></div>
    <div class="page-hero-content">
      <p class="hero-eyebrow reveal visible">FULL INVENTORY</p>
      <h1 class="page-hero-title reveal visible">The Collection</h1>
      <p class="page-hero-sub reveal visible">Every car and truck on our lot, inspected, certified, and ready for the road.</p>
    </div>
  </header>

  <!-- Inventory -->
  <section class="inventory" id="inventory">
    <div class="filters">
      <div class="filter-group">
        <input type="text" id="searchInput" class="filter-search" placeholder="Search make, model, or trim...">
      </div>
      <div class="filter-group">
        <select id="makeFilter" class="filter-select">
          <option value="">All Makes</option>
        </select>
        <select id="sortFilter" class="filter-select">
          <option value="newest">Newest first</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
        </select>
      </div>
    </div>

    <div class="truck-grid" id="truckGrid">
      <div class="loading">Loading inventory...</div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="logo-mark">DG</span>
        <span class="logo-text">dangm<em>.ca</em></span>
      </div>
      <p>© <span id="year"></span> dangm.ca. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Page mode: this is the FULL inventory page
    window.SITE_PAGE = 'inventory';
    // Data source: the live Cloudflare Worker (falls back to local data/trucks.json if unreachable)
    window.SITE_CONFIG = { apiBase: 'https://eagle-ridge-trucks.fblister.workers.dev/api' };
  </script>
  <script src="js/main.js"></script>
</body>
</html>
