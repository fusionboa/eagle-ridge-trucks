name = "eagle-ridge-trucks"
main = "index.js"
compatibility_date = "2025-01-01"

# D1 database — same Cloudflare account DB as FB Lister (separate tables: trucks, backups)
[[d1_databases]]
binding = "D1"
database_name = "fblister-prod-db"
database_id = "10542189-fb0f-4a9b-9b86-19143bdc5418"

# Environment variables
[vars]
ADMIN_EMAILS = "jadenmichalmarwaha@gmail.com,jadenmichalmarwaha2@gmail.com"
# Firebase project (same as FB Lister) — ID tokens from this project are accepted
FIREBASE_PROJECT_ID = "fblisterpro"
# BRIDGE_TOKEN is a secret — set it with: wrangler secret put BRIDGE_TOKEN
