name: Truck Feed Sync

# Runs the FTP → Worker sync on GitHub's free servers, every hour.
# No Pixel, no always-on machine needed.

on:
  schedule:
    - cron: '0 * * * *'     # every hour
  workflow_dispatch:        # allow manual "Run workflow" from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Deploy step needs CLOUDFLARE_API_TOKEN; without it, sync + rebuild
      # still run (live inventory keeps updating) and the deploy shows as
      # "skipped" instead of painting every hourly run red.
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '1' || '0' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sync deps
        working-directory: sync
        run: npm ci --no-audit --no-fund

      - name: Run FTP sync → push to worker
        working-directory: sync
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          CSV_FILE: ${{ secrets.CSV_FILE }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        # Retry: transient D1/worker 500s shouldn't fail the hourly run
        run: |
          for i in 1 2 3; do
            if node sync.js --once; then exit 0; fi
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Rebuild static /v/ pages + vehicle sitemap from live inventory
        run: python3 sync/build-sitemap.py

      - name: Build pages-dist
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -r site/* pages-dist/

      - name: Deploy to Cloudflare Pages (production)
        if: ${{ env.DEPLOY_ENABLED == '1' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-dist --project-name=eagle-ridge-trucks --branch=main --commit-dirty=true
