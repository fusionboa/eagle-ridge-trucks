name: Truck Feed Sync

# Runs the FTP → Worker sync on GitHub's free servers, every hour.
# No Pixel, no always-on machine needed.

on:
  schedule:
    # Hourly at :17. GitHub delays or drops scheduled runs at the top of the
    # hour (its busiest minute): ':00' was firing only every 3-9 hours.
    - cron: '17 * * * *'
  workflow_dispatch:        # allow manual "Run workflow" from GitHub UI

# Never run two syncs at once (a slow run must finish before the next deploys)
concurrency:
  group: truck-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Deploy step needs CLOUDFLARE_API_TOKEN; without it, sync + rebuild
      # still run (live inventory keeps updating) and the deploy shows as
      # "skipped" instead of painting every hourly run red.
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '1' || '0' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sync deps
        working-directory: sync
        run: npm ci --no-audit --no-fund

      - name: Run FTP sync → push to worker
        working-directory: sync
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          CSV_FILE: ${{ secrets.CSV_FILE }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        # Retry: transient D1/worker 500s shouldn't fail the hourly run
        run: |
          for i in 1 2 3; do
            if node sync.js --once; then exit 0; fi
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      # Fast photo copies (sync/build-photos.py): kept between runs, so only
      # new arrivals are downloaded; the first ~8,000 spread over a few runs.
      - name: Restore baked vehicle photos
        uses: actions/cache/restore@v4
        with:
          path: site/images/photos
          key: vehicle-photos-${{ github.run_id }}
          restore-keys: vehicle-photos-

      - name: Bake fast vehicle photos (cards + galleries)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow || echo "pillow install failed; pages keep the original photos"
          python3 sync/build-photos.py

      - name: Save baked vehicle photos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: site/images/photos
          key: vehicle-photos-${{ github.run_id }}

      - name: Rebuild static /v/ pages + vehicle sitemap from live inventory
        run: python3 sync/build-sitemap.py

      - name: Rebuild static forum threads + forum sitemap from live posts
        run: python3 sync/build-forum.py

      - name: Rebuild static city location pages + locations sitemap
        run: python3 sync/build-locations.py

      - name: Bake homepage hero vehicle + optimised photos (most expensive listed truck)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow || echo "pillow install failed; hero falls back to remote photos"
          python3 sync/build-hero.py

      - name: Build pages-dist
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -r site/* pages-dist/

      - name: Deploy to Cloudflare Pages (production)
        if: ${{ env.DEPLOY_ENABLED == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Retry: Cloudflare occasionally answers "Unknown internal error" on
        # publish (Oct 12 13:00 run); one blip shouldn't fail the whole sync.
        # --branch=main is required, or the deploy lands on Preview.
        run: |
          for i in 1 2 3; do
            if npx --yes wrangler@3.90.0 pages deploy pages-dist --project-name=eagle-ridge-trucks --branch=main --commit-dirty=true; then exit 0; fi
            echo "deploy attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1
